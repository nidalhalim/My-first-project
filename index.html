<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Mon premier projet</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f0f4ff;
        padding-top: 80px;
      }

      h1 {
        color: #2b4c9b;
      }

      p {
        font-size: 20px;
      }

      input,
      button {
        padding: 12px;
        font-size: 16px;
      }

      button {
        background-color: #2b4c9b;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>Bonjour !</h1>

    <p id="message">Ma première page web est sur GitHub.</p>

    <input id="prenom" type="text" placeholder="Écris ton prénom">

    <button onclick="direBonjour()">Dire bonjour</button>

    <script>
      function direBonjour() {
        const prenom = document.getElementById("prenom").value;

        document.getElementById("message").textContent =
          "Bonjour, " + prenom + " !";
      }
    </script>
  </body>
</html>
