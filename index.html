<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Ma liste de tâches</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 80px auto;
        padding: 0 20px;
        background-color: #f0f4ff;
      }

      h1 {
        color: #2b4c9b;
      }

      .ajout {
        display: flex;
        gap: 8px;
      }

      input,
      button {
        padding: 12px;
        font-size: 16px;
      }

      input {
        flex: 1;
      }

      button {
        background-color: #2b4c9b;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      li {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        padding: 12px;
        background: white;
        border-radius: 8px;
      }

      li button {
        background-color: #b42318;
        padding: 6px 10px;
      }
    </style>
  </head>

  <body>
    <h1>Ma liste de tâches</h1>

    <div class="ajout">
      <input id="tache" type="text" placeholder="Écris une tâche">
      <button onclick="ajouterTache()">Ajouter</button>
    </div>

    <ul id="liste"></ul>

    <script>
      function ajouterTache() {
        const texte = document.getElementById("tache").value;

        if (texte === "") {
          return;
        }

        const nouvelleTache = document.createElement("li");
        nouvelleTache.textContent = texte;

        const supprimer = document.createElement("button");
        supprimer.textContent = "Supprimer";
        supprimer.onclick = function () {
          nouvelleTache.remove();
        };

        nouvelleTache.appendChild(supprimer);
        document.getElementById("liste").appendChild(nouvelleTache);
        document.getElementById("tache").value = "";
      }
    </script>
  </body>
</html>
