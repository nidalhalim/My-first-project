<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Mon premier projet</title>
  </head>
  <body>
    <h1>Bonjour !</h1>

    <p id="message">Ma première page web est sur GitHub.</p>

    <button onclick="changerMessage()">
      Clique ici
    </button>

    <script>
      function changerMessage() {
        document.getElementById("message").textContent =
          "Bravo, tu viens d'utiliser JavaScript !";
      }
    </script>
  </body>
</html>
